<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7008"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
  </defs>

  <!-- Left Crest Badge -->
  <g transform="translate(4, 3)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0E0E11" stroke="url(#logoGold)" stroke-width="2"/>
    <!-- Crown -->
    <path d="M22 17 L27 21 L32 14 L37 21 L42 17 L40 23 L24 23 Z" fill="url(#logoGold)"/>
    <circle cx="22" cy="15" r="1.2" fill="#FFF"/>
    <circle cx="32" cy="12" r="1.5" fill="#FFF"/>
    <circle cx="42" cy="15" r="1.2" fill="#FFF"/>
    <!-- Outer sports circle -->
    <circle cx="32" cy="38" r="15" stroke="url(#logoGold)" stroke-width="1.5" stroke-dasharray="2 1"/>
    <!-- Stylized KELME Paw & K mark -->
    <path d="M25 31 V45 M25 38 H30 M30 31 L38 45 M30 45 L38 31" stroke="url(#silverGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="27" r="1.5" fill="url(#logoGold)"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(80, 16)">
    <!-- Main Brand Name -->
    <text x="0" y="24" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
      sport.<tspan fill="url(#logoGold)">NAVOIY</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="1" y="40" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#A1A1AA">
      D&amp;A SPORT · KELME RASMIY
    </text>
  </g>
</svg>
